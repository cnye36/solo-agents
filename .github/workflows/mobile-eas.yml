name: mobile-eas

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (Android only)
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      - packages/config/**
      - packages/types/**
      - .github/workflows/mobile-eas.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mobile app
        run: pnpm --filter @solo-agents/mobile typecheck

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS build (Android)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROFILE="${{ github.event.inputs.profile }}"
          else
            PROFILE="preview"
          fi
          eas build --non-interactive --profile "$PROFILE" --platform android
